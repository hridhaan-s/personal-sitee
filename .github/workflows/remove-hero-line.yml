name: Remove Hero Cursor Line

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove hero cursor line
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("style.css")
          s = p.read_text()
          s = s.replace("  border-right: 2px solid var(--text);\n", "")
          p.write_text(s)
          Path(".github/workflows/remove-hero-line.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove hero cursor line" || exit 0
          git push
