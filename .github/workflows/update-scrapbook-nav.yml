name: Update Scrapbook Nav

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update navbar
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("index.html")
          text = index.read_text()

          desktop = '''      <li><a href="/blog" data-route="blog">Blog</a></li>\n      <li><a href="#links" data-section="links">Links</a></li>'''
          desktop_new = '''      <li><a href="/blog" data-route="blog">Blog</a></li>\n      <li><a href="https://scrapbook.hridhaan.me/index.html" target="_blank" rel="noopener noreferrer" class="scrapbook-nav-link">Scrapbook <span class="scrapbook-click">Click here</span></a></li>\n      <li><a href="#links" data-section="links">Links</a></li>'''

          mobile = '''    <a href="/blog" data-route="blog">Blog</a>\n    <a href="#links" data-section="links">Links</a>'''
          mobile_new = '''    <a href="/blog" data-route="blog">Blog</a>\n    <a href="https://scrapbook.hridhaan.me/index.html" target="_blank" rel="noopener noreferrer" class="scrapbook-nav-link">Scrapbook <span class="scrapbook-click">Click here</span></a>\n    <a href="#links" data-section="links">Links</a>'''

          if "scrapbook-nav-link" not in text:
              if desktop not in text or mobile not in text:
                  raise SystemExit("Expected navbar markup was not found; aborting without changes.")
              text = text.replace(desktop, desktop_new, 1)
              text = text.replace(mobile, mobile_new, 1)
              index.write_text(text)

          css = Path("style.css")
          css_text = css.read_text()
          marker = "/* SCRAPBOOK NAV */"
          if marker not in css_text:
              css_text += '''\n\n/* SCRAPBOOK NAV */\n.scrapbook-nav-link {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.scrapbook-click {\n  position: absolute;\n  left: 50%;\n  top: calc(100% + 7px);\n  transform: translateX(-50%);\n  font-size: 9px;\n  font-weight: 700;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  white-space: nowrap;\n  color: var(--gold);\n  animation: scrapbookPulse 1.5s ease-in-out infinite;\n  pointer-events: none;\n}\n\n.scrapbook-click::before {\n  content: "↓";\n  margin-right: 3px;\n}\n\n@keyframes scrapbookPulse {\n  0%, 100% {\n    opacity: 0.45;\n    transform: translateX(-50%) translateY(0);\n  }\n  50% {\n    opacity: 1;\n    transform: translateX(-50%) translateY(3px);\n  }\n}\n\n@media (max-width: 900px) {\n  .scrapbook-click {\n    display: none;\n  }\n}\n\n.nav-mobile .scrapbook-nav-link {\n  position: relative;\n}\n'''
              css.write_text(css_text)
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          rm -f .github/workflows/update-scrapbook-nav.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css .github/workflows/update-scrapbook-nav.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Add animated Scrapbook link to navbar"
          git push