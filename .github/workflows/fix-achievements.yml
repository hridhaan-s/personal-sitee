name: Fix achievements page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply achievements redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = Path("style.css")
          text = css.read_text()
          marker = "/* FINAL ACHIEVEMENTS REDESIGN */"

          if marker not in text:
              text += r'''

          /* FINAL ACHIEVEMENTS REDESIGN */

          #page-achievements {
            display: block;
            min-height: calc(100vh - 64px);
            padding: 110px 24px 100px;
          }

          #page-achievements .achievements-wrap {
            width: min(1040px, 100%);
            margin: 0 auto;
            padding: 0;
          }

          #page-achievements .achievements-hero {
            text-align: center;
            margin: 0 auto 52px;
            max-width: 720px;
          }

          #page-achievements .achievements-hero h1 {
            margin: 0 0 12px;
            font-size: clamp(2.4rem, 5vw, 4rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
          }

          #page-achievements .achievements-hero p {
            margin: 0 auto;
            max-width: 650px;
            color: var(--text);
            opacity: 0.62;
            line-height: 1.7;
          }

          #page-achievements .achievement {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(220px, 320px);
            align-items: center;
            gap: 42px;
            width: 100%;
            margin: 0 0 24px;
            padding: 32px;
            background: color-mix(in srgb, var(--card) 88%, transparent);
            border: 1px solid rgba(128,128,128,0.14);
            border-radius: 24px;
            box-shadow: 0 18px 50px rgba(0,0,0,0.07);
            overflow: hidden;
            backdrop-filter: blur(14px);
          }

          .dark #page-achievements .achievement {
            background: rgba(20,20,20,0.72);
            border-color: rgba(255,255,255,0.08);
            box-shadow: 0 20px 55px rgba(0,0,0,0.28);
          }

          #page-achievements .achievement:not(:has(.achievement-proof, .ICT-Proof)) {
            grid-template-columns: minmax(0, 1fr);
          }

          #page-achievements .achievement-text {
            min-width: 0;
          }

          #page-achievements .achievement-text h2 {
            margin: 0 0 8px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--gold);
            opacity: 0.9;
          }

          #page-achievements .achievement-text h3 {
            margin: 0 0 12px;
            padding-right: 150px;
            font-size: clamp(1.2rem, 2.4vw, 1.55rem);
            line-height: 1.25;
            letter-spacing: -0.02em;
          }

          #page-achievements .achievement-text p {
            margin: 0;
            max-width: 680px;
            font-size: 0.98rem;
            line-height: 1.75;
            opacity: 0.72;
          }

          #page-achievements .achievement .tag {
            position: absolute;
            top: 24px;
            right: 24px;
            display: inline-flex;
            align-items: center;
            width: auto;
            max-width: 180px;
            margin: 0;
            padding: 7px 11px;
            border: 1px solid rgba(201,162,77,0.25);
            border-radius: 999px;
            background: rgba(201,162,77,0.12);
            color: var(--gold);
            font-size: 0.66rem;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            box-shadow: none;
            backdrop-filter: blur(10px);
          }

          #page-achievements .achievement .tag::after {
            display: none;
          }

          #page-achievements .achievement-proof,
          #page-achievements .ICT-Proof {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
          }

          #page-achievements .achievement-proof img,
          #page-achievements .ICT-Proof img {
            display: block;
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 16px;
            border: 1px solid rgba(128,128,128,0.16);
            background: rgba(128,128,128,0.04);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            transform: none;
          }

          #page-achievements .achievement-proof img:hover,
          #page-achievements .ICT-Proof img:hover {
            transform: scale(1.015);
            box-shadow: 0 18px 40px rgba(0,0,0,0.18);
          }

          #page-achievements .achievement-archive {
            margin: 44px 0 0;
            padding: 34px 28px;
            text-align: center;
            border: 1px solid rgba(201,162,77,0.2);
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(201,162,77,0.10), rgba(201,162,77,0.025));
          }

          #page-achievements .achievement-archive h4 {
            margin: 0 0 8px;
            font-size: 1.1rem;
          }

          #page-achievements .achievement-archive p {
            margin: 0 0 16px;
            opacity: 0.65;
            line-height: 1.6;
          }

          #page-achievements .achievement-archive a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
          }

          #page-achievements .achievement-archive a:hover {
            text-decoration: underline;
          }

          @media (max-width: 768px) {
            #page-achievements {
              padding: 92px 16px 72px;
            }

            #page-achievements .achievements-hero {
              margin-bottom: 34px;
            }

            #page-achievements .achievement,
            #page-achievements .achievement:not(:has(.achievement-proof, .ICT-Proof)) {
              grid-template-columns: 1fr;
              gap: 22px;
              padding: 24px;
              border-radius: 20px;
            }

            #page-achievements .achievement-text h3 {
              padding-right: 0;
              margin-top: 38px;
            }

            #page-achievements .achievement .tag {
              top: 18px;
              left: 24px;
              right: auto;
              max-width: calc(100% - 48px);
            }

            #page-achievements .achievement-proof img,
            #page-achievements .ICT-Proof img {
              max-height: 360px;
            }
          }
          '''
              css.write_text(text)

          Path(".github/workflows/fix-achievements.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign achievements page" || exit 0
          git push
